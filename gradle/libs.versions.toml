room = "2.6.1"
pdfbox = "2.0.27.0"
timber = "5.0.1"
okhttp = "4.12.0"
kotlinxSerializationJson = "1.7.1"
kotlinxCoroutines = "1.8.1"
coil = "2.7.0"
junit = "4.13.2"
androidxTestExt = "1.2.1"
espresso = "3.6.1"
mockk = "1.13.12"
turbine = "1.1.0"
